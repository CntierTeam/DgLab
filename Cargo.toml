[package]
name = "dglab"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DG-LAB Coyote V2/V3 BLE CLI/TUI controller (仅学习用)"
authors = ["DgLab contributors"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
btleplug = "0.11"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"

[dev-dependencies]
hex-literal = "0.4"
